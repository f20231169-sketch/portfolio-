<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Clean Warm Background -->
  <rect width="800" height="450" fill="#f8fafc"/>

  <!-- Centered Brand / Deck Card -->
  <g transform="translate(140, 40)" filter="url(#cardShadow)">
    <rect width="520" height="370" rx="28" fill="#13151b" stroke="#262935" stroke-width="2"/>

    <!-- Orange Accent Header Band -->
    <rect x="0" y="0" width="520" height="12" rx="6" fill="url(#headerGrad)"/>

    <!-- Top Badge -->
    <rect x="40" y="36" width="168" height="26" rx="13" fill="#222530" stroke="#333846" stroke-width="1"/>
    <circle cx="53" cy="49" r="4" fill="#f97316"/>
    <text x="65" y="53" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="1">MARKET RESEARCH</text>

    <text x="480" y="54" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ea580c" text-anchor="end">IBM SPSS • n=60</text>

    <!-- Main Title -->
    <text x="40" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="30" fill="#ffffff" letter-spacing="-0.5">Quick-Commerce Pharmacy</text>
    <text x="40" y="146" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="30" fill="#f97316" letter-spacing="-0.5">Entry Study: Pilani</text>

    <text x="40" y="178" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">K-Means Cluster Segmentation &amp; Strategic Model Evaluation</text>

    <!-- 3 Mini Data Cards -->
    <g transform="translate(40, 205)">
      <!-- Card 1: Segments -->
      <rect x="0" y="0" width="136" height="90" rx="14" fill="#1b1e27" stroke="#2c303f" stroke-width="1"/>
      <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">CLUSTER 2</text>
      <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#22c55e">43.3%</text>
      <text x="16" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Ready Adopters</text>

      <!-- Card 2: Cautious -->
      <rect x="152" y="0" width="136" height="90" rx="14" fill="#1b1e27" stroke="#2c303f" stroke-width="1"/>
      <text x="168" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">CLUSTER 1</text>
      <text x="168" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#38bdf8">33.3%</text>
      <text x="168" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Cautious Seekers</text>

      <!-- Card 3: Key Recommendation -->
      <rect x="304" y="0" width="136" height="90" rx="14" fill="#1b1e27" stroke="#2c303f" stroke-width="1"/>
      <text x="320" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">RECOMMENDED</text>
      <text x="320" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#f97316">73.3%</text>
      <text x="320" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Own Warehouse</text>
    </g>

    <!-- Bottom Footer Tag -->
    <line x1="40" y1="318" x2="480" y2="318" stroke="#262935" stroke-width="1"/>
    <text x="40" y="344" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">HYPOTHESIS TESTING • ANOVA (p &lt; .001) • 19-PAGE DECK</text>
    <text x="480" y="344" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">BITS PILANI // 2024</text>
  </g>
</svg>
