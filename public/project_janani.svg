<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#f43f5e" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Off-White / Pale Ivory Base -->
  <rect width="800" height="450" fill="#fffdfa"/>

  <!-- Pastel Corner Accents matching uploaded screenshot -->
  <circle cx="70" cy="70" r="38" fill="#ffe4e6" opacity="0.85"/>
  <circle cx="730" cy="380" r="44" fill="#dcfce7" opacity="0.85"/>

  <!-- Centered Composition -->
  <g transform="translate(400, 225)" text-anchor="middle" filter="url(#softGlow)">
    
    <!-- MATERNAL CARE Pill Badge -->
    <g transform="translate(0, -115)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#e11d48" letter-spacing="3.5">MATERNAL CARE</text>
    </g>

    <!-- Janani Headline -->
    <text x="0" y="-8" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="88" fill="#1c1917" letter-spacing="-1">Janani</text>

    <!-- Smiling Pink Arc Accent -->
    <path d="M -130,22 Q 0,60 130,22" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>

    <!-- CARE Spaced Letters -->
    <text x="0" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#57534e" letter-spacing="12">C A R E</text>

    <!-- Subtitle Line -->
    <text x="0" y="128" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="14.5" fill="#78716c" letter-spacing="0.5">Empathetic Clinical &amp; Restorative Pregnancy Companion</text>
  </g>
</svg>
