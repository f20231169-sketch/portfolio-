<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="instaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Warm Light Editorial Canvas matching screenshot -->
  <rect width="800" height="450" fill="#faf7f2"/>

  <!-- Centered Instagram Script Wordmark -->
  <g transform="translate(400, 225)" filter="url(#instaShadow)" text-anchor="middle">
    <!-- Instagram Script Wordmark Rendering -->
    <text x="0" y="32" font-family="'Grand Hotel', 'Brush Script MT', 'Dancing Script', 'Snell Roundhand', 'Bickham Script Pro', cursive, serif" font-weight="700" font-size="124" fill="#121212" letter-spacing="-1">Instagram</text>
  </g>
</svg>
